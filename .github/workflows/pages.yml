name: Verify & deploy workbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build + verify dependencies
        run: |
          pip install markdown-it-py mdit-py-plugins jinja2 pygments pyyaml numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build site and companion package
        run: python build/build.py
      - name: Verify every exercise (solutions, scaffold answers, starters)
        run: |
          python build/verify.py
          WB_IMPL=solutions python -m pytest
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
