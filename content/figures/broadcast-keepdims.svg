<text class="fx-mono fx-muted" x="66.5" y="144" font-size="14" text-anchor="middle">z (3, 3)</text>
<text class="fx-mono fx-muted" x="190.5" y="144" font-size="14" text-anchor="middle">m (3, 1)</text>
<text class="fx-mono fx-muted" x="314.5" y="144" font-size="14" text-anchor="middle">z − m</text>
<g class="fx-a-in" style="--d:2.6s"><text class="fx-ui fx-ok-ink" x="14" y="171" font-size="14">Each row loses its own max (the 0s). Correct.</text></g>
