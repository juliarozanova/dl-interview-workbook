<svg xmlns="http://www.w3.org/2000/svg" class="fx fx-anim" viewBox="0 0 380 455" role="img" aria-labelledby="fx-keepdims-t fx-keepdims-d">
<title id="fx-keepdims-t">keepdims decides which way the row maxima stretch</title>
<desc id="fx-keepdims-d">z is a 3 by 3 batch of logits: rows 1 5 2, 7 3 0, 4 4 9. Its row maxima are 5, 7, 9. Top, correct: with keepdims=True, m has shape (3, 1), a column, and stretches across each row, so every row has its own max subtracted; each row of the result contains a 0 where its max was. Bottom, bug: without keepdims, m has shape (3,). Broadcasting lines it up with the last axis, so it acts like a row (1, 3) and stretches down the columns: element [i, j] has m[j] subtracted. Rows get different shifts per column, which changes the softmax, and row 2 ends up with 7 minus 5 = 2, a positive value. Because the batch is square it runs without an error; with a non-square batch it raises ValueError.</desc>
<text class="fx-ui fx-ok-ink" x="14" y="20" font-size="14.5" font-weight="600">✓ <tspan class="fx-mono">m = z.max(axis=1, keepdims=True)</tspan></text>
<rect class="fx-cell fx-real" x="22" y="36" width="27" height="27" rx="6"/><text class="fx-mono fx-tx-real" x="35.5" y="54.9" font-size="15" text-anchor="middle">1</text>
<rect class="fx-cell fx-real" x="53" y="36" width="27" height="27" rx="6"/><text class="fx-mono fx-tx-real" x="66.5" y="54.9" font-size="15" text-anchor="middle">5</text>
