<svg xmlns="http://www.w3.org/2000/svg" class="fx fx-anim" viewBox="0 0 380 474" role="img" aria-labelledby="fx-stretch-t fx-stretch-d">
<title id="fx-stretch-t">What stretching a size-1 axis means, on actual numbers</title>
<desc id="fx-stretch-d">a is a column of shape (3, 1) holding 10, 20, 30; b is a row of shape (1, 4) holding 1, 2, 3, 4. Step 1: a&#x27;s column is repeated across 4 columns (dashed, virtual copies). Step 2: b&#x27;s row is repeated down 3 rows (dashed, virtual). Step 3: the two (3, 4) grids are subtracted elementwise, giving rows 9 8 7 6, 19 18 17 16, 29 28 27 26; for example row 2, column 3 is 20 minus 3 = 17. The dashed copies are never stored: the broadcast view has stride 0 along the stretched axis. Only the result is allocated.</desc>
<rect class="fx-pill fx-a-flash" x="5" y="6" width="118" height="28" rx="14" style="--d:0.3s;--dur:2.0s"/>
<text class="fx-ui fx-text" x="64" y="25" font-size="14" text-anchor="middle" font-weight="600">① stretch a →</text>
<rect class="fx-pill fx-a-flash" x="131" y="6" width="118" height="28" rx="14" style="--d:2.4s;--dur:1.7s"/>
<text class="fx-ui fx-text" x="190" y="25" font-size="14" text-anchor="middle" font-weight="600">② stretch b ↓</text>
<rect class="fx-pill fx-a-flash" x="257" y="6" width="118" height="28" rx="14" style="--d:4.2s;--dur:2.2s"/>
<text class="fx-ui fx-text" x="316" y="25" font-size="14" text-anchor="middle" font-weight="600">③ subtract</text>
<text class="fx-mono fx-ink" x="26" y="66" font-size="15" font-weight="600">a <tspan class="fx-muted">(3, 1)</tspan></text>
<text class="fx-mono fx-ink" x="218" y="66" font-size="15" font-weight="600">b <tspan class="fx-muted">(1, 4)</tspan></text>
<rect class="fx-cell fx-real" x="26" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-real" x="41.0" y="98.4" font-size="15" text-anchor="middle">10</text>
<rect class="fx-cell fx-real" x="26" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-real" x="41.0" y="132.4" font-size="15" text-anchor="middle">20</text>
<rect class="fx-cell fx-real" x="26" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-real" x="41.0" y="166.4" font-size="15" text-anchor="middle">30</text>
<g class="fx-a-slide fx-fade" style="--d:0.9s;--dx:-34px"><rect class="fx-cell fx-virt" x="60" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="75.0" y="98.4" font-size="15" text-anchor="middle">10</text><rect class="fx-cell fx-virt" x="60" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="75.0" y="132.4" font-size="15" text-anchor="middle">20</text><rect class="fx-cell fx-virt" x="60" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="75.0" y="166.4" font-size="15" text-anchor="middle">30</text></g>
<g class="fx-a-slide fx-fade" style="--d:1.3s;--dx:-34px"><rect class="fx-cell fx-virt" x="94" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="109.0" y="98.4" font-size="15" text-anchor="middle">10</text><rect class="fx-cell fx-virt" x="94" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="109.0" y="132.4" font-size="15" text-anchor="middle">20</text><rect class="fx-cell fx-virt" x="94" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="109.0" y="166.4" font-size="15" text-anchor="middle">30</text></g>
<g class="fx-a-slide fx-fade" style="--d:1.7000000000000002s;--dx:-34px"><rect class="fx-cell fx-virt" x="128" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="143.0" y="98.4" font-size="15" text-anchor="middle">10</text><rect class="fx-cell fx-virt" x="128" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="143.0" y="132.4" font-size="15" text-anchor="middle">20</text><rect class="fx-cell fx-virt" x="128" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="143.0" y="166.4" font-size="15" text-anchor="middle">30</text></g>
<rect class="fx-cell fx-real" x="218" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-real" x="233.0" y="98.4" font-size="15" text-anchor="middle">1</text>
<rect class="fx-cell fx-real" x="252" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-real" x="267.0" y="98.4" font-size="15" text-anchor="middle">2</text>
<rect class="fx-cell fx-real" x="286" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-real" x="301.0" y="98.4" font-size="15" text-anchor="middle">3</text>
<rect class="fx-cell fx-real" x="320" y="78" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-real" x="335.0" y="98.4" font-size="15" text-anchor="middle">4</text>
<g class="fx-a-slide fx-fade" style="--d:3.0s;--dy:-34px"><rect class="fx-cell fx-virt" x="218" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="233.0" y="132.4" font-size="15" text-anchor="middle">1</text><rect class="fx-cell fx-virt" x="252" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="267.0" y="132.4" font-size="15" text-anchor="middle">2</text><rect class="fx-cell fx-virt" x="286" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="301.0" y="132.4" font-size="15" text-anchor="middle">3</text><rect class="fx-cell fx-virt" x="320" y="112" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="335.0" y="132.4" font-size="15" text-anchor="middle">4</text></g>
<g class="fx-a-slide fx-fade" style="--d:3.4000000000000004s;--dy:-34px"><rect class="fx-cell fx-virt" x="218" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="233.0" y="166.4" font-size="15" text-anchor="middle">1</text><rect class="fx-cell fx-virt" x="252" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="267.0" y="166.4" font-size="15" text-anchor="middle">2</text><rect class="fx-cell fx-virt" x="286" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="301.0" y="166.4" font-size="15" text-anchor="middle">3</text><rect class="fx-cell fx-virt" x="320" y="146" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-virt" x="335.0" y="166.4" font-size="15" text-anchor="middle">4</text></g>
<text class="fx-mono fx-ink" x="188.0" y="133.0" font-size="24" text-anchor="middle">−</text>
<g class="fx-a-in" style="--d:1.9s"><text class="fx-ui fx-tx-virt" x="92" y="196" font-size="14" text-anchor="middle" font-weight="600">acts as (3, 4)</text></g>
<g class="fx-a-in" style="--d:3.6s"><text class="fx-ui fx-tx-virt" x="284" y="196" font-size="14" text-anchor="middle" font-weight="600">acts as (3, 4)</text></g>
<text class="fx-mono fx-ink" x="102" y="317.0" font-size="24" text-anchor="middle">=</text>
<text class="fx-mono fx-ink" x="124" y="250" font-size="15" font-weight="600">a − b <tspan class="fx-muted">(3, 4)</tspan></text>
<g class="fx-a-in" style="--d:4.5s"><rect class="fx-cell fx-ok" x="124" y="262" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="139.0" y="282.4" font-size="15" text-anchor="middle">9</text><rect class="fx-cell fx-ok" x="158" y="262" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="173.0" y="282.4" font-size="15" text-anchor="middle">8</text><rect class="fx-cell fx-ok" x="192" y="262" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="207.0" y="282.4" font-size="15" text-anchor="middle">7</text><rect class="fx-cell fx-ok" x="226" y="262" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="241.0" y="282.4" font-size="15" text-anchor="middle">6</text></g>
<g class="fx-a-in" style="--d:4.95s"><rect class="fx-cell fx-ok" x="124" y="296" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="139.0" y="316.4" font-size="15" text-anchor="middle">19</text><rect class="fx-cell fx-ok" x="158" y="296" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="173.0" y="316.4" font-size="15" text-anchor="middle">18</text><rect class="fx-cell fx-ok" x="192" y="296" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="207.0" y="316.4" font-size="15" text-anchor="middle">17</text><rect class="fx-cell fx-ok" x="226" y="296" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="241.0" y="316.4" font-size="15" text-anchor="middle">16</text></g>
<g class="fx-a-in" style="--d:5.4s"><rect class="fx-cell fx-ok" x="124" y="330" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="139.0" y="350.4" font-size="15" text-anchor="middle">29</text><rect class="fx-cell fx-ok" x="158" y="330" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="173.0" y="350.4" font-size="15" text-anchor="middle">28</text><rect class="fx-cell fx-ok" x="192" y="330" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="207.0" y="350.4" font-size="15" text-anchor="middle">27</text><rect class="fx-cell fx-ok" x="226" y="330" width="30" height="30" rx="6"/><text class="fx-mono fx-tx-ok" x="241.0" y="350.4" font-size="15" text-anchor="middle">26</text></g>
<g class="fx-a-in" style="--d:6.0s"><text class="fx-mono fx-muted" x="266" y="316" font-size="14">← 20 − b</text></g>
<text class="fx-ui fx-text" x="14" y="394" font-size="14">Dashed cells are never stored. The view steps 0 bytes</text>
<text class="fx-ui fx-text" x="14" y="414" font-size="14">along a stretched axis, so it re-reads the same number:</text>
<text class="fx-mono fx-ink" x="14" y="438" font-size="14">np.broadcast_to(a, (3, 4)).strides <tspan class="fx-muted"># (8, 0)</tspan></text>
<text class="fx-ui fx-text" x="14" y="462" font-size="14">Only the result a − b is a real, allocated array.</text>
</svg>
