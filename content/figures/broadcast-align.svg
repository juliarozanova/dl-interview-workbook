<svg xmlns="http://www.w3.org/2000/svg" class="fx fx-anim" viewBox="0 0 380 556" role="img" aria-labelledby="fx-align-t fx-align-d">
<title id="fx-align-t">Broadcasting aligns shapes from the right</title>
<desc id="fx-align-d">Shapes are written as rows of boxes and lined up from the right. Top: a is (4, 1, 3) and b is (2, 3); b slides right so its last axis sits under a&#x27;s last axis, and its missing leading axis becomes a ghost 1. Comparing column by column from the right: 3 and 3 are equal, so keep 3; 1 and 2, so the 1 stretches to 2; 4 and the ghost 1, so the 1 stretches to 4. Result (4, 2, 3). Bottom: a is (4, 3) and b is (4,); right-aligned, the last column pairs 3 with 4, which are unequal and neither is 1, so NumPy raises ValueError. If you meant one value per row, b[:, None] has shape (4, 1) and gives (4, 3).</desc>
<text class="fx-ui fx-ok-ink" x="14" y="20" font-size="15" font-weight="600">Works: <tspan class="fx-mono">(4, 1, 3) − (2, 3)</tspan></text>
<rect class="fx-hl fx-a-flash" x="189" y="30" width="68" height="202" rx="10" style="--d:2.6s;--dur:1.1s"/>
<rect class="fx-hl fx-a-flash" x="121" y="30" width="68" height="202" rx="10" style="--d:3.7s;--dur:1.1s"/>
<rect class="fx-hl fx-a-flash" x="53" y="30" width="68" height="202" rx="10" style="--d:4.8s;--dur:1.1s"/>
<text class="fx-mono fx-ink" x="14" y="62.0" font-size="17" font-weight="600">a</text>
<rect class="fx-cell fx-real" x="58" y="36" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-real" x="87.0" y="62.48" font-size="18" text-anchor="middle">4</text>
<rect class="fx-cell fx-one" x="126" y="36" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-one" x="155.0" y="62.48" font-size="18" text-anchor="middle">1</text>
<rect class="fx-cell fx-real" x="194" y="36" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-real" x="223.0" y="62.48" font-size="18" text-anchor="middle">3</text>
<text class="fx-mono fx-muted" x="266" y="61.0" font-size="15">(4, 1, 3)</text>
<text class="fx-mono fx-ink" x="14" y="110.0" font-size="17" font-weight="600">b</text>
<g class="fx-a-in" style="--d:1.9s"><rect class="fx-cell fx-ghost" x="58" y="84" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-ghost" x="87.0" y="110.48" font-size="18" text-anchor="middle">1</text><text class="fx-ui fx-muted" x="87.0" y="141" font-size="13" text-anchor="middle">missing → 1</text></g>
<g class="fx-a-slide" style="--d:0.5s;--dx:-68px"><rect class="fx-cell fx-real" x="126" y="84" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-real" x="155.0" y="110.48" font-size="18" text-anchor="middle">2</text><rect class="fx-cell fx-real" x="194" y="84" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-real" x="223.0" y="110.48" font-size="18" text-anchor="middle">3</text></g>
<text class="fx-mono fx-muted" x="266" y="109.0" font-size="15">(2, 3)</text>
<line class="fx-rule" x1="14" y1="152" x2="366" y2="152"/>
<text class="fx-mono fx-ink" x="14" y="188.0" font-size="17" font-weight="600">a−b</text>
<g class="fx-a-in" style="--d:4.9s"><rect class="fx-cell fx-stretch" x="58" y="162" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-stretch" x="87.0" y="188.48" font-size="18" text-anchor="middle">4</text><text class="fx-ui fx-tx-stretch" x="87.0" y="222" font-size="14" text-anchor="middle" font-weight="600">1 → 4</text></g>
<g class="fx-a-in" style="--d:3.8s"><rect class="fx-cell fx-stretch" x="126" y="162" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-stretch" x="155.0" y="188.48" font-size="18" text-anchor="middle">2</text><text class="fx-ui fx-tx-stretch" x="155.0" y="222" font-size="14" text-anchor="middle" font-weight="600">1 → 2</text></g>
<g class="fx-a-in" style="--d:2.7s"><rect class="fx-cell fx-ok" x="194" y="162" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-ok" x="223.0" y="188.48" font-size="18" text-anchor="middle">3</text><text class="fx-ui fx-tx-ok" x="223.0" y="222" font-size="14" text-anchor="middle" font-weight="600">3 = 3 ✓</text></g>
<g class="fx-a-in" style="--d:5.6s"><text class="fx-mono fx-muted" x="266" y="187.0" font-size="15">(4, 2, 3)</text></g>
<line class="fx-sep" x1="14" y1="242" x2="366" y2="242"/>
<text class="fx-ui fx-err-ink" x="14" y="270" font-size="15" font-weight="600">Fails: <tspan class="fx-mono">(4, 3) − (4,)</tspan></text>
<rect class="fx-hl-err fx-a-flash" x="189" y="280" width="68" height="186" rx="10" style="--d:8.0s;--dur:1.6s"/>
<text class="fx-mono fx-ink" x="14" y="312.0" font-size="17" font-weight="600">a</text>
<rect class="fx-cell fx-real" x="126" y="286" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-real" x="155.0" y="312.48" font-size="18" text-anchor="middle">4</text>
<rect class="fx-cell fx-real" x="194" y="286" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-real" x="223.0" y="312.48" font-size="18" text-anchor="middle">3</text>
<text class="fx-mono fx-muted" x="266" y="311.0" font-size="15">(4, 3)</text>
<text class="fx-mono fx-ink" x="14" y="360.0" font-size="17" font-weight="600">b</text>
<g class="fx-a-in" style="--d:7.3s"><rect class="fx-cell fx-ghost" x="126" y="334" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-ghost" x="155.0" y="360.48" font-size="18" text-anchor="middle">1</text></g>
<g class="fx-a-slide" style="--d:6.3s;--dx:-68px"><rect class="fx-cell fx-real" x="194" y="334" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-real" x="223.0" y="360.48" font-size="18" text-anchor="middle">4</text></g>
<text class="fx-mono fx-muted" x="266" y="359.0" font-size="15">(4,)</text>
<line class="fx-rule" x1="14" y1="386" x2="366" y2="386"/>
<text class="fx-mono fx-ink" x="14" y="422.0" font-size="17" font-weight="600">a−b</text>
<g class="fx-a-in" style="--d:8.3s"><rect class="fx-cell fx-err" x="194" y="396" width="58" height="40" rx="7"/><text class="fx-mono fx-tx-err" x="223.0" y="422.48" font-size="18" text-anchor="middle">✗</text><text class="fx-ui fx-tx-err" x="223.0" y="456" font-size="14" text-anchor="middle" font-weight="600">3 ≠ 4</text><text class="fx-mono fx-tx-err" x="184" y="422.0" font-size="16" text-anchor="end" font-weight="600">ValueError</text></g>
<g class="fx-a-in" style="--d:9.3s"><text class="fx-ui fx-text" x="14" y="488" font-size="14">Meant “one value per row”? Use <tspan class="fx-mono fx-ink">b[:, None]</tspan>:</text><text class="fx-ui fx-text" x="14" y="508" font-size="14">shape (4, 1), and the result is (4, 3) ✓</text></g>
<rect class="fx-cell fx-ok" x="14" y="531" width="20" height="18" rx="4"/><text class="fx-ui fx-tx-ok" x="24" y="545" font-size="13" text-anchor="middle" font-weight="700">✓</text><text class="fx-ui fx-muted" x="40" y="545" font-size="14">equal: keep</text><rect class="fx-cell fx-stretch" x="134.3" y="531" width="20" height="18" rx="4"/><text class="fx-ui fx-tx-stretch" x="144.3" y="545" font-size="13" text-anchor="middle" font-weight="700">↔</text><text class="fx-ui fx-muted" x="160.3" y="545" font-size="14">1: stretch</text><rect class="fx-cell fx-err" x="247.3" y="531" width="20" height="18" rx="4"/><text class="fx-ui fx-tx-err" x="257.3" y="545" font-size="13" text-anchor="middle" font-weight="700">✗</text><text class="fx-ui fx-muted" x="273.3" y="545" font-size="14">else: error</text>
</svg>
