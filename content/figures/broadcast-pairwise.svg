<svg xmlns="http://www.w3.org/2000/svg" class="fx fx-anim" viewBox="0 0 380 430" role="img" aria-labelledby="fx-pairwise-t fx-pairwise-d">
<title id="fx-pairwise-t">Pairwise distances: (N, 1, D) minus (1, M, D) gives (N, M, D), then sum over D</title>
<desc id="fx-pairwise-d">Pairwise distances as a broadcast. Y[None, :, :] has shape (1, M, D): a row of M vectors y0 to y3, drawn as D stacked sheets, one per feature. X[:, None, :] has shape (N, 1, D): a column of N vectors x0 to x2. Subtracting them fills an N by M grid like a times table, still with D sheets: shape (N, M, D). Cell [1, 2] holds x1 minus y2, one difference per feature. Squaring and summing over the last axis collapses the D sheets into one, giving the (N, M) matrix of squared distances.</desc>
<text class="fx-mono fx-ink" x="112" y="22" font-size="15" font-weight="600">Y[None, :, :]</text>
<text class="fx-ui fx-muted" x="112" y="41" font-size="14">(1, M, D): a row of y’s</text>
<rect class="fx-sheet fx-sheet-1" x="123" y="55" width="114" height="30" rx="6"/><rect class="fx-cell fx-real" x="126" y="58" width="24" height="24" rx="5"/><rect class="fx-cell fx-real" x="154" y="58" width="24" height="24" rx="5"/><rect class="fx-cell fx-real" x="182" y="58" width="24" height="24" rx="5"/><rect class="fx-cell fx-real" x="210" y="58" width="24" height="24" rx="5"/>
