# Curriculum order. A chapter with `file:` is built; the rest show as "coming soon".
# `weeks` places each chapter on the 12-week plan (drives the dashboard's "this week").
title: Interview Practice Workbook
subtitle: Implementation-first deep learning, paced over twelve weeks. Companion text — Prince, *Understanding Deep Learning*.
udl_url: https://udlbook.github.io/udlbook/

parts:
  - num: I
    title: Foundations
    weeks: "1–3"
    chapters:
      - {num: "01", slug: "01-tensors", title: "Tensors, shapes & broadcasting", udl: "—", weeks: [1], file: "part1-foundations/01-tensors.md"}
      - {num: "02", slug: "02-linear-models", title: "Supervised learning & linear models", udl: "Ch. 2", weeks: [1], file: "part1-foundations/02-linear-models.md"}
      - {num: "03", slug: "03-deep-networks", title: "Shallow → deep networks", udl: "Ch. 3–4", weeks: [1, 2], file: "part1-foundations/03-deep-networks.md"}
      - {num: "04", slug: "04-loss-functions", title: "Loss functions from maximum likelihood", udl: "Ch. 5", weeks: [2], file: "part1-foundations/04-loss-functions.md"}
      - {num: "05", slug: "05-backprop", title: "Backprop & automatic differentiation", udl: "Ch. 7", weeks: [2], file: "part1-foundations/05-backprop.md"}
      - {num: "06", slug: "06-initialisation", title: "Initialisation & gradient flow", udl: "Ch. 7", weeks: [2, 3], file: "part1-foundations/06-initialisation.md"}
      - {num: "07", slug: "07-optimisation", title: "Optimisation", udl: "Ch. 6", weeks: [3], file: "part1-foundations/07-optimisation.md"}
      - {num: "08", slug: "08-generalisation", title: "Generalisation & regularisation", udl: "Ch. 8–9", weeks: [3], file: "part1-foundations/08-generalisation.md"}
      - {num: "09", slug: "09-training-loop", title: "The training loop & debugging", udl: "Ch. 6–9", weeks: [3], file: "part1-foundations/09-training-loop.md"}
  - num: II
    title: Architectures & representation
    weeks: "4–6"
    chapters:
