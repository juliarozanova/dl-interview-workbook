      - {num: "11", slug: "11-cnns", title: "CNNs & inductive bias", udl: "Ch. 10", weeks: [4], file: "part2-architectures/11-cnns.md"}
      - {num: "12", slug: "12-rnns", title: "RNNs, LSTMs, GRUs", udl: "—", weeks: [5], file: "part2-architectures/12-rnns.md"}
      - {num: "13", slug: "13-attention", title: "Attention", udl: "Ch. 12", weeks: [5], file: "part2-architectures/13-attention.md"}
      - {num: "14", slug: "14-transformers", title: "Transformers", udl: "Ch. 12", weeks: [5, 6], file: "part2-architectures/14-transformers.md"}
      - {num: "15", slug: "15-moe", title: "Mixture of experts", udl: "—", weeks: [6], file: "part2-architectures/15-moe.md"}
      - {num: "16", slug: "16-autoencoders", title: "Embeddings & autoencoders", udl: "Ch. 14", weeks: [6], file: "part2-architectures/16-autoencoders.md"}
  - num: III
