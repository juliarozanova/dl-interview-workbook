[project]
name = "interview-workbook"
version = "0.1.0"
description = "Implementation-first deep learning interview workbook (static HTML)."
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=3",
  "mdit-py-plugins>=0.4",
  "jinja2>=3.1",
  "pygments>=2.17",
  "pyyaml>=6",
  "numpy>=1.26",
  "pytest>=8",
  "playwright>=1.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["companion/tests", "companion/workbook"]
addopts = "--import-mode=importlib -q"
